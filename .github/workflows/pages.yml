name: Validate game
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript modules
        run: |
          node --check src/main.js
          node --check src/data.js
      - name: Verify required files
        run: |
          test -f index.html
          test -f styles/main.css
          test -f README.md
          grep -q 'src/main.js' index.html
          grep -q 'styles/main.css' index.html
